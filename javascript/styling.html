<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .myclass{
            background-color: black;
            color: #fff;
        }
    </style>
    <script>
        function changeText(){
            document.querySelector("#h1_id").style.color="Red";
            // document.querySelector("#h1_id").classList.add("myclass")
        }
    </script>
</head>
<body>
    <h1 class="myclass" id="h1_id">this is javascript</h1>
    <button onclick="changeText()">Click to change the style</button>
</body>
</html>
